<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャンネルポイント交換ビューア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel-2:#21262d;
    --border:#30363d;
    --text:#e6edf3;
    --text-dim:#8b949e;
    --accent:#2ea043;
    --accent-dim:#1a7f37;
    --ok:#3fb950;
    --warn:#d29922;
    --err:#f85149;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: "Inter", "Yu Gothic UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:12.5px;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* --- 上部バー --- */
  .topbar{
    flex:none; display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-bottom:1px solid var(--border); background:var(--panel);
  }
  .topbar .status{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; color:var(--text-dim); flex:none;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--text-dim); flex:none;}
  .dot.on{background:var(--ok); box-shadow:0 0 0 3px rgba(78,230,163,.15);}
  .dot.err{background:var(--err);}
  .dot.pending{background:var(--warn);}
  .topbar .spacer{flex:1;}
  .btn-settings{font-size:11px; padding:6px 12px; white-space:nowrap;}
  .btn-settings.authed{border-color:var(--ok); color:var(--ok); background:transparent;}
  .btn-settings.attention{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-settings.warn{border-color:var(--err); color:var(--err); background:transparent;}

  /* --- 設定パネル --- */
  #settingsPanel{
    flex:none; background:var(--panel); border-bottom:1px solid var(--border);
    padding:10px; display:flex; flex-direction:column; gap:12px;
    max-height:60vh; overflow-y:auto;
  }
  #settingsPanel.collapsed{display:none;}
  .section{display:flex; flex-direction:column; gap:8px;}
  .section-title{font-size:10.5px; color:var(--text-dim); letter-spacing:.03em; text-transform:uppercase;}
  .divider{border-top:1px solid var(--border); margin:0;}

  select, input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); padding:6px 8px; border-radius:6px; font-size:12px;
    font-family:var(--mono);
  }
  select:focus, input[type=text]:focus{outline:none; border-color:var(--accent);}
  .hint{font-size:10.5px; color:var(--text-dim); line-height:1.5;}
  .who{font-size:11px; color:var(--text-dim); font-family:var(--mono);}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

  button{
    font-family:var(--sans); font-size:12px; font-weight:600; cursor:pointer;
    border-radius:6px; border:1px solid transparent; padding:6px 12px;
    transition:opacity .15s;
  }
  button:hover{opacity:.88;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:transparent; border-color:var(--border); color:var(--text);}
  .log{font-family:var(--mono); font-size:10px; color:var(--text-dim); line-height:1.6; white-space:pre-wrap; max-height:60px; overflow-y:auto;}

  /* --- リワードのプルダウン一覧 --- */
  #rewardList{display:flex; flex-direction:column; gap:6px;}
  .reward-row{display:flex; gap:6px; align-items:center;}
  .reward-row select{flex:1;}
  .reward-row.new-slot select{border-color:var(--err); box-shadow:0 0 0 1px var(--err);}
  .btn-trash{color:var(--text-dim); font-size:18px; font-weight:400; line-height:1;}
  .btn-trash:hover{color:var(--err); border-color:var(--err);}
  .btn-add{width:100%; margin-top:2px;}
  .reward-empty{font-size:11px; color:var(--text-dim); padding:6px 2px;}
  .reward-error{
    font-size:11px; color:var(--err); background:rgba(255,107,107,.12);
    border:1px solid var(--err); border-radius:6px; padding:7px 9px; line-height:1.5;
  }

  /* --- 交換一覧(スクロール領域) --- */
  .feedwrap{flex:1; overflow-y:auto; padding:8px 10px;}
  .feed{list-style:none; margin:0; padding:0;}
  .feed li{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px;
    margin-bottom:8px; background:var(--panel);
  }
  .feed .meta{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; gap:8px;}
  .feed .user{font-weight:600; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .feed .reward{font-size:10px; color:var(--accent); font-family:var(--mono);}
  .feed .time{font-size:10px; color:var(--text-dim); font-family:var(--mono); flex:none;}
  .feed .text{
    font-family:var(--mono); font-size:12px; line-height:1.5; color:var(--text);
    white-space:pre-wrap; word-break:break-word; margin-bottom:7px;
  }
  .btn-copy{
    background:var(--panel-2); border:1px solid var(--border); color:var(--accent);
    font-family:var(--mono); font-size:10.5px; padding:4px 9px;
  }
  .btn-copy.copied{background:var(--ok); border-color:var(--ok); color:#111;}
  .empty{color:var(--text-dim); font-size:11.5px; text-align:center; padding:24px 0; font-family:var(--mono);}

  /* --- 下部固定のコピー全体バー --- */
  .copybar{flex:none; padding:8px 10px; border-top:1px solid var(--border); background:var(--panel);}
  .btn-copyall{
    width:100%; background:var(--accent-dim); border:1px solid var(--accent); color:#fff;
    padding:9px; font-size:11.5px;
  }
  .btn-copyall.copied{background:var(--ok); border-color:var(--ok); color:#111;}
  .btn-copyall:disabled{opacity:.35;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

  <div class="topbar">
    <span class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">未接続</span>
    </span>
    <button class="btn-settings btn-ghost" id="settingsToggleBtn">設定</button>
    <span class="spacer"></span>
  </div>

  <div id="settingsPanel" class="collapsed">
    <div class="section">
      <div class="section-title">アカウント</div>
      <div class="row">
        <button class="btn-primary" id="loginBtn">Twitchでログイン</button>
        <button class="btn-ghost" id="logoutBtn" style="display:none;">ログアウト</button>
      </div>
      <div class="who" id="whoAmI"></div>
      <div class="log" id="logArea"></div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-title">対象のリワード(複数選択可)</div>
      <div class="row">
        <button class="btn-ghost" id="refreshRewardsBtn">リワード情報を更新</button>
      </div>
      <div id="rewardList">
        <div class="reward-empty">先にログインしてください</div>
      </div>
      <div class="hint">テキスト入力が設定されているリワードのみ表示しています。</div>
    </div>

    <div class="divider"></div>
    <button class="btn-ghost" id="closeSettingsBtn">閉じる</button>
  </div>

  <div class="feedwrap">
    <ul class="feed" id="feed"></ul>
    <div class="empty" id="emptyMsg">まだ交換はありません</div>
  </div>

  <div class="copybar">
    <button class="btn-copyall" id="copyAllBtn" disabled>すべてコピー</button>
  </div>

<script>
// ==== 運営者が最初に1回だけ設定する項目 ====
// dev.twitch.tv/console で発行したClient IDをここに埋め込む。
// このファイルを配置する固定URL(下記REDIRECT_URI)を
// Twitchアプリの「OAuth Redirect URLs」に登録しておくこと。
const CLIENT_ID = '1wfdr29bx3owx5fheul1om2a5c0oka';
// ============================================

const REDIRECT_URI = location.origin + location.pathname;
const LS_ACCOUNT = 'twpc_account';        // { id, login, display_name, token }
const LS_REWARD_IDS = 'twpc_reward_ids';  // JSON配列

const els = {
  settingsToggleBtn: document.getElementById('settingsToggleBtn'),
  settingsPanel: document.getElementById('settingsPanel'),
  closeSettingsBtn: document.getElementById('closeSettingsBtn'),
  loginBtn: document.getElementById('loginBtn'),
  logoutBtn: document.getElementById('logoutBtn'),
  whoAmI: document.getElementById('whoAmI'),
  rewardList: document.getElementById('rewardList'),
  refreshRewardsBtn: document.getElementById('refreshRewardsBtn'),
  statusDot: document.getElementById('statusDot'),
  statusText: document.getElementById('statusText'),
  logArea: document.getElementById('logArea'),
  feed: document.getElementById('feed'),
  emptyMsg: document.getElementById('emptyMsg'),
  copyAllBtn: document.getElementById('copyAllBtn'),
};

let state = {
  token: null,
  broadcasterId: null,
  accountDisplayName: null,
  ws: null,
  rewards: [],          // is_user_input_required=trueのみ
  selectedRewardIds: [],
  hasMissingReward: false,
};
let feedItems = []; // {user, text} 新しい順

function log(msg){
  const t = new Date().toLocaleTimeString('ja-JP');
  els.logArea.textContent += `[${t}] ${msg}\n`;
  els.logArea.scrollTop = els.logArea.scrollHeight;
}

let lastStatusKind = '';
function setStatus(kind, text){
  lastStatusKind = kind;
  els.statusDot.className = 'dot' + (kind ? ' ' + kind : '');
  els.statusText.textContent = text;
  refreshSettingsButtonColor(kind);
}

// 設定ボタンの色で「未設定/接続中/切断・エラー/正常」がひと目でわかるようにする
function refreshSettingsButtonColor(kind){
  const btn = els.settingsToggleBtn;
  btn.classList.remove('attention', 'authed', 'warn');
  if(state.hasMissingReward){
    btn.classList.add('warn'); // 保存済みリワードが見つからない
  }else if(!state.token || state.selectedRewardIds.length === 0){
    btn.classList.add('attention'); // ログイン or リワード選択が未完了
  }else if(kind === 'on'){
    btn.classList.add('authed'); // 正常に接続中
  }else if(kind === 'err'){
    btn.classList.add('warn'); // 切断・エラー
  }
  // pending等はニュートラル(通常のボタン見た目)のまま
}

// ---- 設定ボタン/パネルの開閉(開いている間は「閉じる」ボタンになる) ----
function isPanelOpen(){ return !els.settingsPanel.classList.contains('collapsed'); }
function openPanel(){
  els.settingsPanel.classList.remove('collapsed');
  els.settingsToggleBtn.textContent = '閉じる';
}
function closePanel(){
  els.settingsPanel.classList.add('collapsed');
  els.settingsToggleBtn.textContent = '設定';
}
els.settingsToggleBtn.addEventListener('click', () => {
  isPanelOpen() ? closePanel() : openPanel();
});
els.closeSettingsBtn.addEventListener('click', closePanel);

function updateSettingsButtonAuthState(){
  refreshSettingsButtonColor(lastStatusKind);
}

// ---- localStorage ヘルパー ----
function loadAccount(){
  try{ return JSON.parse(localStorage.getItem(LS_ACCOUNT) || 'null'); }catch(e){ return null; }
}
function saveAccount(account){ localStorage.setItem(LS_ACCOUNT, JSON.stringify(account)); }
function clearAccount(){
  localStorage.removeItem(LS_ACCOUNT);
  localStorage.removeItem(LS_REWARD_IDS);
}
function loadSelectedRewardIds(){
  try{ return JSON.parse(localStorage.getItem(LS_REWARD_IDS) || '[]'); }catch(e){ return []; }
}
function saveSelectedRewardIds(ids){ localStorage.setItem(LS_REWARD_IDS, JSON.stringify(ids)); }

// ---- ログイン(Implicit Grant Flow。Client IDは埋め込み済みなので入力不要) ----
els.loginBtn.addEventListener('click', () => {
  if(CLIENT_ID === 'YOUR_CLIENT_ID_HERE'){
    alert('コード内のCLIENT_IDが未設定です。運営者に連絡してください。');
    return;
  }
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'token',
    scope: 'channel:read:redemptions',
  });
  location.href = 'https://id.twitch.tv/oauth2/authorize?' + params.toString();
});

els.logoutBtn.addEventListener('click', () => {
  if(state.ws) state.ws.close();
  state = {token:null, broadcasterId:null, accountDisplayName:null, ws:null, rewards:[], selectedRewardIds:[], hasMissingReward:false};
  clearAccount();
  els.loginBtn.style.display = '';
  els.logoutBtn.style.display = 'none';
  els.whoAmI.textContent = '';
  renderRewardPicker();
  updateSettingsButtonAuthState();
  setStatus('', '未接続');
  openPanel();
});

// ---- リダイレクト後、hashからトークンを取り出す。なければ保存済みアカウントで自動ログイン ----
async function handleRedirect(){
  const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
  const hashParams = new URLSearchParams(hash);
  const token = hashParams.get('access_token');

  if(!token){
    const saved = loadAccount();
    if(saved){ await loginWithAccount(saved); }
    else{ openPanel(); }
    return;
  }

  history.replaceState(null, '', REDIRECT_URI); // URLからトークンを消す
  setStatus('pending', 'ユーザー情報を取得中...');
  try{
    const user = await getMe(token);
    const account = { id: user.id, login: user.login, display_name: user.display_name, token };
    saveAccount(account);
    log(`ログイン成功: ${user.display_name} (id:${user.id})`);
    await loginWithAccount(account);
  }catch(e){
    setStatus('err', 'ログインに失敗しました');
    log('エラー: ' + e.message);
    openPanel();
  }
}

async function loginWithAccount(account){
  setStatus('pending', account.display_name + ' として確認中...');
  try{
    await getMe(account.token); // トークンが生きているか検証
  }catch(e){
    log(`保存済みトークンが無効です(再ログインが必要): ${e.message}`);
    setStatus('err', '再ログインが必要です');
    clearAccount();
    openPanel();
    return;
  }
  state.token = account.token;
  state.broadcasterId = account.id;
  state.accountDisplayName = account.display_name;
  els.loginBtn.style.display = 'none';
  els.logoutBtn.style.display = '';
  els.whoAmI.textContent = account.display_name + ' としてログイン中';
  updateSettingsButtonAuthState();

  await loadRewards(account.id);
}

async function getMe(token){
  const res = await fetch('https://api.twitch.tv/helix/users', {
    headers: { 'Authorization': 'Bearer ' + token, 'Client-Id': CLIENT_ID }
  });
  if(!res.ok) throw new Error('ユーザー情報の取得に失敗 (' + res.status + ')');
  const data = await res.json();
  if(!data.data || !data.data[0]) throw new Error('ユーザー情報が空です');
  return data.data[0];
}

// ---- リワード情報を手動で更新 ----
els.refreshRewardsBtn.addEventListener('click', async () => {
  if(!state.token){
    alert('先にログインしてください');
    return;
  }
  els.refreshRewardsBtn.disabled = true;
  els.refreshRewardsBtn.textContent = '更新中...';
  await loadRewards(state.broadcasterId);
  els.refreshRewardsBtn.disabled = false;
  els.refreshRewardsBtn.textContent = 'リワード情報を更新';
});

// ---- リワード一覧を取得(テキスト入力ありのみ)してプルダウンで表示 ----
async function loadRewards(broadcasterId){
  showAddRewardSlot = false;
  setStatus('pending', 'リワード一覧を取得中...');
  els.rewardList.innerHTML = '<div class="reward-empty">読み込み中...</div>';
  try{
    const res = await fetch(`https://api.twitch.tv/helix/channel_points/custom_rewards?broadcaster_id=${broadcasterId}`, {
      headers: { 'Authorization': 'Bearer ' + state.token, 'Client-Id': CLIENT_ID }
    });
    if(!res.ok) throw new Error('リワード一覧の取得に失敗 (' + res.status + ')');
    const data = await res.json();
    state.rewards = (data.data || []).filter(r => r.is_user_input_required);
    renderRewardPicker();
  }catch(e){
    setStatus('err', 'リワード一覧の取得に失敗しました');
    els.rewardList.innerHTML = '<div class="reward-empty">取得に失敗しました</div>';
    openPanel();
  }
}

// 選択中のリワードを行(プルダウン+削除ボタン)で表示する。
// 「＋」を押すと空のプルダウン(赤枠)が追加され、選ぶとその行として確定する。
// 前回保存されていたリワードがもう存在しない場合はエラー表示する。
let showAddRewardSlot = false;

function renderRewardPicker(){
  if(!state.token){
    els.rewardList.innerHTML = '<div class="reward-empty">先にログインしてください</div>';
    return;
  }
  if(state.rewards.length === 0){
    els.rewardList.innerHTML = '<div class="reward-empty">テキスト入力ありのリワードが見つかりません</div>';
    return;
  }

  const saved = loadSelectedRewardIds();
  const missing = saved.filter(id => !state.rewards.some(r => r.id === id));
  state.selectedRewardIds = saved.filter(id => state.rewards.some(r => r.id === id));
  state.hasMissingReward = missing.length > 0;

  let html = '';
  if(missing.length > 0){
    html += `<div class="reward-error">前回選択していたリワードが見つかりません(削除された可能性があります): ${missing.length}件</div>`;
  }

  const remaining = state.rewards.filter(r => !state.selectedRewardIds.includes(r.id));

  state.selectedRewardIds.forEach((id, idx) => {
    const current = state.rewards.find(r => r.id === id);
    const options = [current, ...remaining];
    html += buildRewardRow(idx, id, options, false);
  });

  if(showAddRewardSlot && remaining.length > 0){
    html += buildRewardRow(state.selectedRewardIds.length, '', remaining, true);
  }

  if(remaining.length > 0 && !showAddRewardSlot){
    html += `<button class="btn-ghost btn-add" id="addRewardBtn" type="button">＋ リワードを追加</button>`;
  }

  els.rewardList.innerHTML = html || '<div class="reward-empty">すべてのリワードが選択されています</div>';

  els.rewardList.querySelectorAll('select[data-idx]').forEach(sel => {
    sel.addEventListener('change', onRewardSelectChange);
  });
  els.rewardList.querySelectorAll('.btn-trash[data-idx]').forEach(btn => {
    btn.addEventListener('click', onRewardRowDelete);
  });
  const addBtn = document.getElementById('addRewardBtn');
  if(addBtn) addBtn.addEventListener('click', () => { showAddRewardSlot = true; renderRewardPicker(); });

  if(missing.length > 0) openPanel();

  if(state.selectedRewardIds.length === 0){
    if(state.ws) state.ws.close();
    setStatus('', 'リワードを選択してください');
    if(!missing.length) openPanel();
  }else{
    connectEventSub();
  }
  refreshSettingsButtonColor(lastStatusKind); // hasMissingReward の反映
}

function buildRewardRow(idx, currentId, options, isNewSlot){
  const opts = options.map(r =>
    `<option value="${r.id}" ${r.id === currentId ? 'selected' : ''}>${escapeHtml(r.title)}</option>`
  ).join('');
  const placeholder = isNewSlot ? '<option value="" selected disabled>-- 選択してください --</option>' : '';
  return `
    <div class="reward-row${isNewSlot ? ' new-slot' : ''}">
      <select data-idx="${idx}">${placeholder}${opts}</select>
      <button class="iconbtn btn-trash" data-idx="${idx}" title="削除" type="button">×</button>
    </div>
  `;
}

function onRewardSelectChange(e){
  const idx = Number(e.target.dataset.idx);
  const val = e.target.value;
  if(!val) return;
  if(idx < state.selectedRewardIds.length){
    state.selectedRewardIds[idx] = val;
  }else{
    state.selectedRewardIds.push(val);
    showAddRewardSlot = false;
  }
  saveSelectedRewardIds(state.selectedRewardIds);
  renderRewardPicker();
}

function onRewardRowDelete(e){
  const idx = Number(e.currentTarget.dataset.idx);
  if(idx < state.selectedRewardIds.length){
    state.selectedRewardIds.splice(idx, 1);
    saveSelectedRewardIds(state.selectedRewardIds);
  }else{
    showAddRewardSlot = false; // 未選択の追加行を削除(キャンセル)
  }
  renderRewardPicker();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- EventSub (WebSocket) ---
function connectEventSub(url){
  if(state.ws) state.ws.close();
  setStatus('pending', 'EventSubに接続中...');
  const ws = new WebSocket(url || 'wss://eventsub.wss.twitch.tv/ws');
  state.ws = ws;

  ws.onmessage = async (ev) => {
    let msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    const type = msg.metadata && msg.metadata.message_type;

    if(type === 'session_welcome'){
      const sessionId = msg.payload.session.id;
      try{
        for(const rewardId of state.selectedRewardIds){
          await subscribeRedemption(sessionId, rewardId);
        }
        setStatus('on', `接続中・待機中(${state.selectedRewardIds.length}件のリワード)`);
      }catch(e){
        setStatus('err', '購読の作成に失敗しました');
        log('エラー: ' + e.message);
      }
    } else if(type === 'session_reconnect'){
      const newUrl = msg.payload.session.reconnect_url;
      log('再接続を要求されました');
      ws.close();
      connectEventSub(newUrl);
    } else if(type === 'notification'){
      handleNotification(msg.payload);
    } else if(type === 'session_keepalive'){
      // no-op
    } else if(type === 'revocation'){
      setStatus('err', '購読が取り消されました');
      log('購読取り消し: ' + JSON.stringify(msg.payload.subscription.status));
    }
  };

  ws.onclose = () => {
    if(state.ws === ws){
      setStatus('err', '切断されました');
      log('WebSocket切断');
    }
  };
  ws.onerror = () => log('WebSocketエラーが発生しました');
}

async function subscribeRedemption(sessionId, rewardId){
  const res = await fetch('https://api.twitch.tv/helix/eventsub/subscriptions', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + state.token,
      'Client-Id': CLIENT_ID,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      type: 'channel.channel_points_custom_reward_redemption.add',
      version: '1',
      condition: { broadcaster_user_id: state.broadcasterId, reward_id: rewardId },
      transport: { method: 'websocket', session_id: sessionId },
    }),
  });
  if(!res.ok){
    const body = await res.text();
    throw new Error('購読作成失敗 (' + res.status + '): ' + body);
  }
}

function handleNotification(payload){
  if(!payload.event) return;
  const ev = payload.event;
  addFeedItem(
    ev.user_name || ev.user_login || '(不明なユーザー)',
    ev.user_input || '(テキスト入力なし)',
    ev.reward && ev.reward.title || ''
  );
}

function addFeedItem(userName, text, rewardTitle){
  els.emptyMsg.style.display = 'none';
  feedItems.unshift({ user: userName, text });
  updateCopyAllState();

  const li = document.createElement('li');
  const time = new Date().toLocaleTimeString('ja-JP');
  li.innerHTML = `
    <div class="meta">
      <span class="user"></span>
      <span class="time">${time}</span>
    </div>
    ${rewardTitle && state.selectedRewardIds.length > 1 ? `<div class="reward"></div>` : ''}
    <div class="text"></div>
    <button class="btn-copy">コピー</button>
  `;
  li.querySelector('.user').textContent = userName;
  const rewardEl = li.querySelector('.reward');
  if(rewardEl) rewardEl.textContent = rewardTitle;
  li.querySelector('.text').textContent = text;
  const btn = li.querySelector('.btn-copy');
  btn.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(text);
      btn.textContent = 'コピーしました';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 1500);
    }catch(e){
      btn.textContent = 'コピー失敗';
    }
  });
  els.feed.prepend(li);
}

function updateCopyAllState(){
  els.copyAllBtn.disabled = feedItems.length === 0;
}

els.copyAllBtn.addEventListener('click', async () => {
  const combined = feedItems.map(i => `${i.text}（${i.user}）`).join('\r\n');
  try{
    await navigator.clipboard.writeText(combined);
    els.copyAllBtn.textContent = `コピーしました(${feedItems.length}件)`;
    els.copyAllBtn.classList.add('copied');
    setTimeout(() => {
      els.copyAllBtn.textContent = 'すべてコピー';
      els.copyAllBtn.classList.remove('copied');
    }, 1500);
  }catch(e){
    els.copyAllBtn.textContent = 'コピー失敗';
  }
});

setStatus('', '未接続');
handleRedirect();
</script>
</body>
